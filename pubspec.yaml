name: all_validations_br
description: Complete Flutter toolkit for Brazilian validations, form masks, typed results, structured logging, and authenticated cryptography.
version: 5.0.0
homepage: https://github.com/CriandoGames/all_validations_br
repository: https://github.com/CriandoGames/all_validations_br
issue_tracker: https://github.com/CriandoGames/all_validations_br/issues

topics:
  - validation
  - brazil
  - formatter
  - mask
  - cpf

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  all_br_forms: ">=1.0.0 <2.0.0"
  all_br_validations: ">=1.0.0 <2.0.0"
  all_crypto: ">=1.0.1 <2.0.0"
  all_logger: ">=1.0.0 <2.0.0"
  all_result: ">=1.0.0 <2.0.0"
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
